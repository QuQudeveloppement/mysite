name: Update Likes

on:
  workflow_dispatch:
    inputs:
      id:
        description: "ID de l'article"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update likes.json
        run: |
          FILE="likes.json"

          if [ ! -f "$FILE" ]; then
            echo "{}" > "$FILE"
          fi

          OLD=$(jq -r --arg id "${{ github.event.inputs.id }}" '.[$id] // 0' "$FILE")
          NEW=$((OLD + 1))

          jq --arg id "${{ github.event.inputs.id }}" --argjson count "$NEW" \
            '.[$id] = $count' "$FILE" > tmp.json && mv tmp.json "$FILE"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add likes.json
          git commit -m "Update likes for ${{ github.event.inputs.id }}"
          git push
