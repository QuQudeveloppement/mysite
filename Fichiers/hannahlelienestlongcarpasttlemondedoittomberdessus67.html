<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hannah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f4ede2;
    --ink: #2b1f1c;
    --heart: #b3262e;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191413;
      --ink: #f1e6d8;
      --heart: #d6494f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191413;
    --ink: #f1e6d8;
    --heart: #d6494f;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scene {
    position: relative;
    width: min(86vw, 62vh);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    transform-origin: 50% 55%;
    animation: beat 1.4s ease-in-out 5.8s infinite;
  }
  @keyframes beat {
    0%   { transform: scale(1); }
    12%  { transform: scale(1.07); }
    24%  { transform: scale(1); }
    38%  { transform: scale(1.045); }
    55%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  .heart {
    fill: var(--heart);
    fill-opacity: 0;
    stroke: var(--heart);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation:
      draw 5s cubic-bezier(.45, .05, .4, 1) forwards,
      fill 1.8s ease-in-out 5s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fill { to { fill-opacity: .14; } }

  h1 {
    position: relative;
    margin: 0 0 4% 0;
    display: flex;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(3rem, 16vw, 8rem);
    letter-spacing: .02em;
    color: var(--ink);
  }
  h1 span {
    display: inline-block;
    opacity: 0;
    animation: drop 1s cubic-bezier(.5, 0, .75, .6) both;
  }
  h1 span:nth-child(1) { animation-delay: 0s; }
  h1 span:nth-child(2) { animation-delay: .8s; }
  h1 span:nth-child(3) { animation-delay: 1.6s; }
  h1 span:nth-child(4) { animation-delay: 2.4s; }
  h1 span:nth-child(5) { animation-delay: 3.2s; }
  h1 span:nth-child(6) { animation-delay: 4s; }

  @keyframes drop {
    0%   { transform: translateY(-80vh); opacity: 0; }
    10%  { opacity: 1; }
    62%  { transform: translateY(0); opacity: 1; }
    80%  { transform: translateY(-2.4vh); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    svg { animation: none; }
    .heart { animation: none; stroke-dashoffset: 0; fill-opacity: .14; }
    h1 span { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="scene">
    <svg viewBox="0 0 200 180" aria-hidden="true">
      <path class="heart" pathLength="1"
        d="M100 166 C 34 112, 8 72, 34 40 C 55 15, 90 22, 100 52 C 110 22, 145 15, 166 40 C 192 72, 166 112, 100 166 Z"/>
    </svg>
    <h1 aria-label="Hannah"><span>h</span><span>a</span><span>n</span><span>n</span><span>a</span><span>h</span></h1>
  </div>
</body>
</html>
