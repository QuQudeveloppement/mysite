<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Empile</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2a3a; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var BH = 30;                       // hauteur d'un bloc
  var state = 'menu';                // menu | play | over
  var blocks, cur, dir, pieces, cam, camT, score, combo, best = 0, lock = 0, flash = 0, msg = '', msgT = 0, t0 = 0;
  var audio = null;

  try { best = parseInt(localStorage.getItem('empile_best')) || 0; } catch (e) {}

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function baseW() { return Math.min(W * 0.62, 300); }
  function baseY() { return H - 120; }
  function hue(n) { return (200 + n * 9) % 360; }

  function beep(f, d) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.18, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + d);
    } catch (e) {}
  }
  function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  function reset() {
    var w = baseW();
    blocks = [{ x: (W - w) / 2, w: w }];
    pieces = []; cam = 0; camT = 0; score = 0; combo = 0; msg = ''; flash = 0;
    spawn();
  }

  function spawn() {
    var top = blocks[blocks.length - 1];
    dir = blocks.length % 2 ? 1 : -1;
    cur = { x: dir > 0 ? -top.w * 0.3 : W - top.w * 0.7, w: top.w };
  }

  function speed() { return Math.min(230 + blocks.length * 9, 560); }

  function drop() {
    var top = blocks[blocks.length - 1];
    var left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    var n = blocks.length;
    if (right - left <= 0) { // raté
      pieces.push({ x: cur.x, w: cur.w, y: n, vy: 0, h: hue(n) });
      end(); return;
    }
    if (Math.abs(cur.x - top.x) <= 5) { // parfait
      combo++;
      var nw = top.w;
      if (combo >= 3) nw = Math.min(top.w + 8, baseW());
      blocks.push({ x: top.x - (nw - top.w) / 2, w: nw });
      flash = 1; msg = combo > 1 ? 'Parfait x' + combo : 'Parfait'; msgT = 0.9;
      beep(520 + combo * 70, 0.18); vib(15);
    } else {
      combo = 0;
      if (cur.x < top.x) pieces.push({ x: cur.x, w: top.x - cur.x, y: n, vy: 0, h: hue(n) });
      else pieces.push({ x: right, w: cur.x + cur.w - right, y: n, vy: 0, h: hue(n) });
      blocks.push({ x: left, w: right - left });
      beep(300 + n * 6, 0.1); vib(8);
    }
    score = blocks.length - 1;
    camT = Math.max(0, (blocks.length - 5) * BH);
    spawn();
  }

  function end() {
    state = 'over'; lock = performance.now() + 500;
    if (score > best) { best = score; try { localStorage.setItem('empile_best', best); } catch (e) {} }
    beep(150, 0.4); vib([40, 40, 80]);
  }

  function press(e) {
    if (e) e.preventDefault();
    if (state === 'menu') { reset(); state = 'play'; beep(440, 0.1); }
    else if (state === 'play') drop();
    else if (state === 'over' && performance.now() > lock) { reset(); state = 'play'; }
  }
  cv.addEventListener('touchstart', press, { passive: false });
  cv.addEventListener('mousedown', function (e) { if (!('ontouchstart' in window)) press(e); });
  window.addEventListener('keydown', function (e) { if (e.code === 'Space') press(e); });

  function side(x, y, w, h, hu) {
    ctx.fillStyle = 'hsl(' + hu + ' 62% 58%)';
    ctx.fillRect(x, y, w, h - 4);
    ctx.fillStyle = 'hsl(' + hu + ' 62% 40%)';
    ctx.fillRect(x, y + h - 4, w, 4);
  }

  function text(s, x, y, size, color, weight, align) {
    ctx.font = (weight || '700') + ' ' + size + 'px "Trebuchet MS", "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = align || 'center'; ctx.fillStyle = color;
    ctx.fillText(s, x, y);
  }

  function frame(t) {
    var dt = Math.min((t - t0) / 1000, 0.05); t0 = t;
    // mise à jour
    if (state !== 'menu') {
      cam += (camT - cam) * Math.min(1, dt * 6);
      if (state === 'play') {
        cur.x += dir * speed() * dt;
        var lo = -cur.w * 0.3, hi = W - cur.w * 0.7;
        if (cur.x > hi) { cur.x = hi; dir = -1; }
        if (cur.x < lo) { cur.x = lo; dir = 1; }
      }
      for (var i = pieces.length - 1; i >= 0; i--) {
        var p = pieces[i]; p.vy += 1800 * dt; p.off = (p.off || 0) + p.vy * dt;
        if (p.off > H + 200) pieces.splice(i, 1);
      }
    }
    flash = Math.max(0, flash - dt * 3); msgT = Math.max(0, msgT - dt);

    // fond
    var n = blocks ? blocks.length : 0, hb = hue(n);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'hsl(' + hb + ' 45% 22%)');
    g.addColorStop(1, 'hsl(' + (hb + 30) + ' 50% 9%)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.12) + ')'; ctx.fillRect(0, 0, W, H); }

    if (state === 'menu') {
      var mw = baseW();
      for (var k = 0; k < 4; k++) side((W - mw * (1 - k * 0.12)) / 2 + (k % 2 ? 14 : -14), H * 0.52 - k * BH, mw * (1 - k * 0.12), BH, hue(k * 2));
      text('Empile', W / 2, H * 0.24, Math.min(W * 0.2, 90), '#f3f7f9', '800');
      text('Touche l\u2019\u00e9cran pour poser le bloc', W / 2, H * 0.32, 18, 'rgba(243,247,249,.75)', '400');
      text('Touche pour jouer', W / 2, H * 0.78, 22, '#f3f7f9', '700');
      if (best) text('Record : ' + best, W / 2, H * 0.84, 17, 'rgba(243,247,249,.7)', '400');
      requestAnimationFrame(frame); return;
    }

    // blocs
    var by = baseY();
    for (var j = 0; j < blocks.length; j++) {
      var y = by - j * BH + cam;
      if (y > -BH && y < H) side(blocks[j].x, y, blocks[j].w, BH, hue(j));
    }
    if (state === 'play') side(cur.x, by - blocks.length * BH + cam, cur.w, BH, hue(blocks.length));
    for (var q = 0; q < pieces.length; q++) {
      var pc = pieces[q];
      side(pc.x, by - pc.y * BH + cam + pc.off, pc.w, BH, pc.h);
    }

    // interface
    text(String(score), W / 2, 90, 64, '#f3f7f9', '800');
    if (msgT > 0 && state === 'play') {
      ctx.globalAlpha = Math.min(1, msgT * 2);
      text(msg, W / 2, 130, 22, '#ffe9a8', '700');
      ctx.globalAlpha = 1;
    }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(5,15,22,.62)'; ctx.fillRect(0, 0, W, H);
      text('Tour effondr\u00e9', W / 2, H * 0.36, Math.min(W * 0.1, 44), '#f3f7f9', '800');
      text('Score : ' + score, W / 2, H * 0.45, 30, '#f3f7f9', '700');
      text(score >= best && score > 0 ? 'Nouveau record' : 'Record : ' + best, W / 2, H * 0.51, 20, '#ffe9a8', '400');
      text('Touche pour rejouer', W / 2, H * 0.62, 22, '#f3f7f9', '700');
    }
    requestAnimationFrame(frame);
  }
  blocks = [{ x: 0, w: 0 }]; pieces = []; cam = 0; camT = 0;
  requestAnimationFrame(function (t) { t0 = t; frame(t); });
})();
</script>
</body>
</html>
