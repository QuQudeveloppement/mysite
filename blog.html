<title>L'Atelier — Accueil</title>
<meta name="description" content="Accueil des projets : électronique, code.">

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* Catégories : barre de filtres + badge (couleurs héritées du thème existant) */
  .cat-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
  .cat-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid currentColor; border-radius: 999px;
    color: inherit; text-decoration: none; opacity: .7;
    font-family: var(--font-display, "Space Mono", monospace); font-size: .8rem;
  }
  .cat-chip:hover, .cat-chip:focus-visible { opacity: 1; }
  .cat-chip.active { opacity: 1; font-weight: 700; background: rgba(127, 127, 127, .22); }
  .cat-chip .cat-n { opacity: .65; font-weight: 400; }
  .badge.cat { text-decoration: none; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div data-led-text="L'ATELIER" data-led-cols="34" aria-label="L'Atelier"></div>
    <nav class="site-nav">
      <a href="index.html">Accueil</a>
      <a href="#archives">Archives</a>
      <a href="forbidden.html"></a>
    </nav>
  </div>
</header>

<main id="app">
  <p class="log-empty">Chargement de l'accueil…</p>
</main>

<footer class="site-footer">
  Publié par QuQuDeveloppement, tous droits réservés 
</footer>

<!-- Génération de ZIP à la volée pour les téléchargements de fichiers -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="matrix.js"></script>
<script src="render.js"></script>
<script src="download.js"></script>
<script>
const app = document.getElementById("app");
let ARTICLES = [];

async function loadArticles() {
  try {
    const res = await fetch("articles.json", { cache: "no-store" });
    if (!res.ok) throw new Error("Fichier articles.json introuvable");
    ARTICLES = await res.json();
  } catch (e) {
    ARTICLES = [];
    app.innerHTML = `<p class="log-empty">Impossible de charger les articles (${escapeHtml(e.message)}).</p>`;
    return;
  }
  render();
}

/* ---------------------------------------------------------------------
   Catégories — champ "category" (texte libre) dans chaque article.
   Le slug sert dans l'URL (#categorie/domotique), la liste des filtres
   est construite automatiquement à partir des articles publiés.
   --------------------------------------------------------------------- */
function catSlug(c) {
  return String(c || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function catBadgeHtml(a) {
  if (!a.category) return "";
  return `<a class="badge cat" href="#categorie/${encodeURIComponent(catSlug(a.category))}">${escapeHtml(a.category)}</a>`;
}

function categoryBarHtml(active, current) {
  const cats = new Map();
  active.forEach(a => {
    if (!a.category) return;
    const s = catSlug(a.category);
    const entry = cats.get(s) || { label: a.category, n: 0 };
    entry.n++;
    cats.set(s, entry);
  });
  if (cats.size === 0) return "";
  const chips = [...cats.entries()]
    .sort((x, y) => x[1].label.localeCompare(y[1].label, "fr"))
    .map(([s, e]) => `<a class="cat-chip ${s === current ? "active" : ""}" href="#categorie/${encodeURIComponent(s)}">${escapeHtml(e.label)} <span class="cat-n">${e.n}</span></a>`)
    .join("");
  return `<nav class="cat-bar" aria-label="Catégories">
    <a class="cat-chip ${current ? "" : "active"}" href="#">Tout <span class="cat-n">${active.length}</span></a>${chips}
  </nav>`;
}

function articleCardHtml(a) {
  return `
    <article class="log-entry ${a.cover ? "has-cover" : ""}">
      ${a.cover ? `<a class="log-thumb" href="#article/${encodeURIComponent(a.id)}">
        <img src="${a.cover}" alt="" loading="lazy">
      </a>` : ""}
      <div class="log-entry-body">
        <div class="log-date">
          ${a.pinned ? '<span class="badge pinned">📌 Épinglé</span>' : ""}
          ${formatDate(a.date)}
          ${catBadgeHtml(a)}
          ${isArchived(a) ? '<span class="badge">Archivé</span>' : ""}
        </div>
        <h2 class="log-title"><a href="#article/${encodeURIComponent(a.id)}">${escapeHtml(a.title)}</a></h2>
        <p class="log-excerpt">${escapeHtml(a.excerpt || "")}</p>
        <div class="log-meta">
          <span class="like-count">♥ <span data-like-display="${escapeHtml(a.id)}">…</span></span>
        </div>
      </div>
    </article>
  `;
}

function renderList(currentSlug = "") {
  const active = ARTICLES.filter(a => !isArchived(a));
  const shown = currentSlug ? active.filter(a => catSlug(a.category) === currentSlug) : active;
  const sorted = [...shown].sort((a, b) => {
    const pa = a.pinned ? 1 : 0, pb = b.pinned ? 1 : 0;
    if (pa !== pb) return pb - pa; // épinglés en premier
    return (a.date < b.date ? 1 : -1);
  });
  const bar = categoryBarHtml(active, currentSlug);
  if (sorted.length === 0) {
    const msg = currentSlug ? "Aucun article dans cette catégorie pour l'instant." : "Aucun article publié pour l'instant.";
    app.innerHTML = bar + `<p class="log-empty">${msg}</p>`;
    return;
  }
  app.innerHTML = bar + `<div class="log">${sorted.map(articleCardHtml).join("")}</div>`;

  sorted.forEach(async (a) => {
    const count = await fetchLikeCount(a.id);
    updateLikeDisplays(a.id, count);
  });
}

function renderArchives() {
  const archived = ARTICLES.filter(isArchived);
  const sorted = [...archived].sort((a, b) => (a.date < b.date ? 1 : -1));
  const header = `
    <a class="article-back" href="#">← Retour à l'accueil</a>
    <h1 style="font-family:var(--font-display);font-size:1.3rem;margin:0 0 20px;">Archives</h1>
  `;
  if (sorted.length === 0) {
    app.innerHTML = header + `<p class="log-empty">Aucun article archivé pour l'instant.</p>`;
    return;
  }
  app.innerHTML = header + `<div class="log">${sorted.map(articleCardHtml).join("")}</div>`;

  sorted.forEach(async (a) => {
    const count = await fetchLikeCount(a.id);
    updateLikeDisplays(a.id, count);
  });
}

function renderArticle(id) {
  const article = ARTICLES.find(a => a.id === id);
  if (!article) {
    app.innerHTML = `<p class="log-empty">Article introuvable.</p><a class="article-back" href="#">← Retour à l'accueil</a>`;
    return;
  }
  app.innerHTML = `
    <a class="article-back" href="#">← Retour à l'accueil</a>
    <header class="article-header">
      <span class="log-date">${formatDate(article.date)} ${catBadgeHtml(article)}</span>
      <h1>${escapeHtml(article.title)}</h1>
    </header>
    ${article.cover ? `<figure class="block-image"><img src="${article.cover}" alt=""></figure>` : ""}
    <div class="article-body">${renderArticleBody(article)}</div>

    <div class="like-bar">
      <button type="button" class="btn like-btn" data-like-btn="${escapeHtml(article.id)}" ${hasLikedLocally(article.id) ? "disabled" : ""}>
        <span class="like-label">${hasLikedLocally(article.id) ? "♥ Aimé" : "♡ J'aime"}</span>
        <span data-like-display="${escapeHtml(article.id)}">…</span>
      </button>
    </div>
  `;

  wireLikeButton(article.id);
  fetchLikeCount(article.id).then(count => updateLikeDisplays(article.id, count));
}

function render() {
  const hash = location.hash;
  if (hash.startsWith("#article/")) {
    renderArticle(decodeURIComponent(hash.replace("#article/", "")));
  } else if (hash.startsWith("#categorie/")) {
    renderList(decodeURIComponent(hash.replace("#categorie/", "")));
  } else if (hash === "#archives") {
    renderArchives();
  } else {
    renderList();
  }
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------------
   Likes — compteur PARTAGÉ entre tous les visiteurs, via un service public
   gratuit sans inscription (Abacus : abacus.jasoncameron.dev). Chaque
   article a son propre compteur (namespace + id de l'article).
   Limite assumée : pas de compte visiteur, donc pas de "unlike" possible
   une fois cliqué — juste un like par visiteur, mémorisé dans son navigateur
   pour éviter qu'il clique plusieurs fois.
   --------------------------------------------------------------------- */
const LIKES_NAMESPACE = "ququdeveloppement-mysite";
const LIKED_LOCALLY_KEY = "atelier_liked_articles";

function hasLikedLocally(id) {
  try {
    const arr = JSON.parse(localStorage.getItem(LIKED_LOCALLY_KEY) || "[]");
    return arr.includes(id);
  } catch { return false; }
}
function markLikedLocally(id) {
  try {
    const arr = JSON.parse(localStorage.getItem(LIKED_LOCALLY_KEY) || "[]");
    if (!arr.includes(id)) arr.push(id);
    localStorage.setItem(LIKED_LOCALLY_KEY, JSON.stringify(arr));
  } catch { /* localStorage indisponible : tant pis, pas bloquant */ }
}

async function fetchLikeCount(id) {
  try {
    const res = await fetch(`https://abacus.jasoncameron.dev/get/${LIKES_NAMESPACE}/${encodeURIComponent(id)}`);
    if (!res.ok) return 0;
    const data = await res.json();
    return data.value || 0;
  } catch {
    return 0;
  }
}

async function incrementLikeCount(id) {
  const res = await fetch(`https://abacus.jasoncameron.dev/hit/${LIKES_NAMESPACE}/${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error("Service de likes indisponible pour le moment");
  const data = await res.json();
  return data.value || 0;
}

function updateLikeDisplays(id, count) {
  document.querySelectorAll(`[data-like-display="${CSS.escape(id)}"]`).forEach(el => {
    el.textContent = String(count);
  });
}

function wireLikeButton(id) {
  const btn = document.querySelector(`[data-like-btn="${CSS.escape(id)}"]`);
  if (!btn) return;
  btn.addEventListener("click", async () => {
    if (hasLikedLocally(id)) return;
    btn.disabled = true;
    try {
      const count = await incrementLikeCount(id);
      markLikedLocally(id);
      const label = btn.querySelector(".like-label");
      if (label) label.textContent = "♥ Aimé";
      updateLikeDisplays(id, count);
    } catch (e) {
      btn.disabled = false;
      alert("Impossible d'enregistrer ton like pour le moment, réessaie plus tard.");
    }
  });
}

window.addEventListener("hashchange", render);
loadArticles();
</script>
</body>
</html>
