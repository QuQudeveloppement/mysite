<style>
  body.mobile-compact .log-entry {
    padding: 12px;

  body.hide-category-tags .log-date .badge.cat {
    display: none !important;
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; }
  .tool-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border: 1px solid currentColor; border-radius: 999px;
    background: transparent; color: inherit; cursor: pointer;
    font-family: var(--font-display, "Space Mono", monospace); font-size: .85rem;
  }
  .tool-btn:hover, .tool-btn:focus-visible, .tool-btn[aria-expanded="true"] { background: rgba(127, 127, 127, .22); }
  .tool-btn[hidden] { display: none; }
  .cat-panel { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; padding: 14px; border: 1px solid rgba(127, 127, 127, .45); border-radius: 12px; }
  .cat-panel[hidden] { display: none; }
  .cat-empty { margin: 0; opacity: .75; font-size: .9rem; }
  .article-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
  .cat-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid currentColor; border-radius: 999px; color: inherit; text-decoration: none; opacity: .7; font-family: var(--font-display, "Space Mono", monospace); font-size: .75rem; }
  .cat-chip:hover, .cat-chip:focus-visible { opacity: 1; }
  .cat-chip.active { opacity: 1; font-weight: 700; background: rgba(127, 127, 127, .22); }
  .cat-chip .cat-n { opacity: .65; font-weight: 400; }
  .badge.cat { text-decoration: none; }
  .site-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .nav-btn { appearance: none; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: 7px 12px; font-family: var(--font-display, "Space Mono", monospace); font-size: .75rem; cursor: pointer; }
  .nav-btn:hover, .nav-btn:focus-visible { opacity: 1; background: rgba(127,127,127,.2); }
  .nav-btn[hidden] { display: none; }
  .site-header .site-nav .nav-btn[hidden] { display: none !important; }

  .mobile-settings {
    display: none;
    margin: 0 0 18px;
    padding: 14px 14px 12px;
    border: 1px solid rgba(127,127,127,.42);
    border-radius: 16px;
    background: rgba(127,127,127,.05);
  }
  .mobile-settings.visible { display: block; }
  .mobile-settings-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px;
  }
  .mobile-settings-header h2 {
    margin: 0;
    font-size: 1rem;
    font-family: var(--font-display, "Space Mono", monospace);
  }
  .settings-close {
    border: 1px solid currentColor; border-radius: 999px; background: transparent; color: inherit; padding: 6px 10px; cursor: pointer;
    font-family: var(--font-display, "Space Mono", monospace); font-size: .72rem;
  }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-top: 1px solid rgba(127,127,127,.2);
  }
  .settings-row:first-of-type { border-top: 0; }
  .settings-row span {
    font-size: .9rem;
  }
  .switch {
    position: relative; display: inline-block; width: 46px; height: 26px;
  }
  .switch input {
    opacity: 0; width: 0; height: 0;
  }
  .slider {
    position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.15); transition: .2s ease;
    border: 1px solid rgba(255,255,255,.12);
  }
  .slider:before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 4px; top: 3px; border-radius: 50%; background: #fff; transition: .2s ease;
  }
  .switch input:checked + .slider {
    background: rgba(127,127,127,.42);
  }
  .switch input:checked + .slider:before {
    transform: translateX(20px);
  }
  .settings-install {
    width: 100%; margin-top: 12px; justify-content: center;
  }

  @media (max-width: 768px) {
    .mobile-settings { display: block; }
    .site-nav { justify-content: flex-end; }
    .site-nav a, .site-nav .nav-btn { font-size: .7rem; }

<header class="site-header">
  <div class="header-inner">
    <div data-led-text="L'ATELIER" data-led-cols="34" aria-label="L'Atelier"></div>

      <button type="button" class="nav-btn" id="settingsToggle" aria-expanded="false" aria-controls="settingsPanel">Paramètres</button>
      <a href="forbidden.html" aria-label="Lien vide"></a>
    </nav>
  </div>
</header>

<main id="app">
  <p class="log-empty">Chargement de l'accueil…</p>
</main>

<footer class="site-footer">
  Publié par QuQuDeveloppement, tous droits réservés 
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="matrix.js"></script>
<script src="render.js"></script>
<script src="download.js"></script>
<script>
const app = document.getElementById("app");
let ARTICLES = [];
let deferredInstallPrompt = null;

const MOBILE_SETTINGS_KEY = "atelier_mobile_settings";
const MOBILE_SETTINGS_DEFAULT = { compact: false, showCategoryTags: true };

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

function isMobileViewport() {
  return window.matchMedia("(max-width: 768px)").matches;
}

function isStandaloneMode() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function getMobileSettings() {
  try {
    const stored = JSON.parse(localStorage.getItem(MOBILE_SETTINGS_KEY) || "{}") || {};
    return { ...MOBILE_SETTINGS_DEFAULT, ...stored };
  } catch {
    return { ...MOBILE_SETTINGS_DEFAULT };
  }
}

function setMobileSettings(next) {
  try {
    localStorage.setItem(MOBILE_SETTINGS_KEY, JSON.stringify(next));
  } catch {}
}

function applyMobileDisplaySettings() {
  const settings = getMobileSettings();
  const isCompact = isMobileViewport() && settings.compact;
  const hideTags = isMobileViewport() && !settings.showCategoryTags;
  document.body.classList.toggle("mobile-compact", !!isCompact);
  document.body.classList.toggle("hide-category-tags", !!hideTags);
}

function renderMobileSettings() {
  if (!isMobileViewport()) return "";
  const settings = getMobileSettings();
  const notifyEnabled = localStorage.getItem(NOTIFY_KEY) === "1";
  return `
    <section class="mobile-settings" id="settingsPanel" hidden>
      <div class="mobile-settings-header">
        <h2>Paramètres</h2>
        <button type="button" class="settings-close" id="closeSettingsBtn">Fermer</button>
      </div>
      <div class="settings-row">
        <span>Notifications</span>
        <label class="switch">
          <input type="checkbox" id="notifyToggle" ${notifyEnabled ? "checked" : ""}>
          <span class="slider"></span>
        </label>
      </div>
      <div class="settings-row">
        <span>Accueil compact</span>
        <label class="switch">
          <input type="checkbox" id="compactHomeToggle" ${settings.compact ? "checked" : ""}>
          <span class="slider"></span>
        </label>
      </div>
      <div class="settings-row">
        <span>Afficher les catégories</span>
        <label class="switch">
          <input type="checkbox" id="showCategoryTagsToggle" ${settings.showCategoryTags ? "checked" : ""}>
          <span class="slider"></span>
        </label>
      </div>
      <button type="button" class="tool-btn settings-install" id="installAppBtn" hidden>Installer l'app</button>
    </section>
  `;
}

function openMobileSettings() {
  const panel = document.getElementById("settingsPanel");
  const settingsToggle = document.getElementById("settingsToggle");
  if (!panel || !settingsToggle) return;
  panel.hidden = false;
  panel.classList.add("visible");
  settingsToggle.setAttribute("aria-expanded", "true");
}

function closeMobileSettings() {
  const panel = document.getElementById("settingsPanel");
  const settingsToggle = document.getElementById("settingsToggle");
  if (!panel || !settingsToggle) return;
  panel.hidden = true;
  panel.classList.remove("visible");
  settingsToggle.setAttribute("aria-expanded", "false");
}

function bindSettingsPanel() {
  const settingsToggle = document.getElementById("settingsToggle");
  const panel = document.getElementById("settingsPanel");
  const closeBtn = document.getElementById("closeSettingsBtn");

  if (settingsToggle && !settingsToggle.dataset.bound) {
    settingsToggle.dataset.bound = "1";
    settingsToggle.addEventListener("click", () => {
      const isOpen = panel && !panel.hidden;
      if (isOpen) closeMobileSettings(); else openMobileSettings();
    });
  }

  if (closeBtn && !closeBtn.dataset.bound) {
    closeBtn.dataset.bound = "1";
    closeBtn.addEventListener("click", closeMobileSettings);
  }

  const compactToggle = document.getElementById("compactHomeToggle");
  if (compactToggle && !compactToggle.dataset.bound) {
    compactToggle.dataset.bound = "1";
    compactToggle.addEventListener("change", () => {
      const settings = getMobileSettings();
      settings.compact = !!compactToggle.checked;
      setMobileSettings(settings);
      applyMobileDisplaySettings();
      render();
    });
  }

  const showTagsToggle = document.getElementById("showCategoryTagsToggle");
  if (showTagsToggle && !showTagsToggle.dataset.bound) {
    showTagsToggle.dataset.bound = "1";
    showTagsToggle.addEventListener("change", () => {
      const settings = getMobileSettings();
      settings.showCategoryTags = !!showTagsToggle.checked;
      setMobileSettings(settings);
      applyMobileDisplaySettings();
      render();
    });
  }

  setInstallButtonState();
}

function setInstallButtonState() {
  const btn = document.getElementById("installAppBtn");
  if (!btn) return;

  const installed = isStandaloneMode() || localStorage.getItem("atelier_app_installed") === "1";
  const shouldShow = isMobileViewport() && !installed;
  btn.hidden = !shouldShow;
}

function bindInstallPrompt() {
  const btn = document.getElementById("installAppBtn");
  if (!btn) return;

  window.addEventListener("beforeinstallprompt", (event) => {
    if (!isMobileViewport()) return;
    event.preventDefault();
    deferredInstallPrompt = event;
    setInstallButtonState();
  });

  window.addEventListener("appinstalled", () => {
    localStorage.setItem("atelier_app_installed", "1");
    setInstallButtonState();
  });

  btn.addEventListener("click", async () => {
    if (!deferredInstallPrompt) {
      btn.hidden = true;
      return;
    }

    deferredInstallPrompt.prompt();
    const result = await deferredInstallPrompt.userChoice;
    if (result.outcome === "accepted") {
      localStorage.setItem("atelier_app_installed", "1");
    }
    deferredInstallPrompt = null;
    setInstallButtonState();
  });

  setInstallButtonState();
}

async function loadArticles() {
  try {
    const res = await fetch("articles.json", { cache: "no-store" });
    if (!res.ok) throw new Error("Fichier articles.json introuvable");
    ARTICLES = await res.json();
  } catch (e) {
    ARTICLES = [];
    app.innerHTML = `<p class="log-empty">Impossible de charger les articles (${escapeHtml(e.message)}).</p>`;
    return;
  }
  bindNotificationToggle();
  bindInstallPrompt();
  bindSettingsPanel();
  if (localStorage.getItem(LAST_COMMON_ARTICLE_KEY) === null && getLatestArticleId()) {
    localStorage.setItem(LAST_COMMON_ARTICLE_KEY, getLatestArticleId());
  }
  notifyIfNewArticle();
  startArticlePolling();
  render();
}

function catSlug(c) {
  return String(c || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function catBadgeHtml(a) {
  if (!a.category) return "";
  if (isMobileViewport() && !getMobileSettings().showCategoryTags) return "";
  return `<a class="badge cat" href="#categorie/${encodeURIComponent(catSlug(a.category))}">${escapeHtml(a.category)}</a>`;
}

function collectCategories(active) {
  const cats = new Map();
  active.forEach(a => {
    if (!a.category) return;
    const s = catSlug(a.category);
    const entry = cats.get(s) || { label: a.category, n: 0 };
    entry.n++;
    cats.set(s, entry);
  });
  return cats;
}

function toolbarHtml(active, current) {
  const cats = collectCategories(active);
  const label = current && cats.has(current) ? " : " + cats.get(current).label : "";
  const chips = cats.size === 0
    ? `<p class="cat-empty">Aucune catégorie pour l'instant : les articles n'ont pas encore de champ « category ».</p>`
    : `<a class="cat-chip ${current ? "" : "active"}" href="#">Tout <span class="cat-n">${active.length}</span></a>` +
      [...cats.entries()]
        .sort((x, y) => x[1].label.localeCompare(y[1].label, "fr"))
        .map(([s, e]) => `<a class="cat-chip ${s === current ? "active" : ""}" href="#categorie/${encodeURIComponent(s)}">${escapeHtml(e.label)} <span class="cat-n">${e.n}</span></a>`)
        .join("");
  return `
    <div class="toolbar">
      <button type="button" class="tool-btn" id="catToggle" aria-expanded="false" aria-controls="catPanel">Catégories${escapeHtml(label)}</button>
      <button type="button" class="tool-btn" id="randomBtn">Aléatoire</button>
    </div>
    <div class="cat-panel" id="catPanel" hidden>${chips}</div>`;
}

function goRandom(list, excludeId = "") {
  const pool = list.filter(a => a.id !== excludeId);
  const choices = pool.length ? pool : list;
  if (choices.length === 0) return;
  const pick = choices[Math.floor(Math.random() * choices.length)];
  location.hash = "#article/" + encodeURIComponent(pick.id);
}

function wireToolbar(list) {
  const toggle = document.getElementById("catToggle");
  const panel = document.getElementById("catPanel");
  if (toggle && panel) {
    toggle.addEventListener("click", () => {
      const opening = panel.hasAttribute("hidden");
      if (opening) panel.removeAttribute("hidden"); else panel.setAttribute("hidden", "");
      toggle.setAttribute("aria-expanded", String(opening));
    });
  }
  const rnd = document.getElementById("randomBtn");
  if (rnd) rnd.addEventListener("click", () => goRandom(list));
}

function articleCardHtml(a) {
  return `
    <article class="log-entry ${a.cover ? "has-cover" : ""}">
      ${a.cover ? `<a class="log-thumb" href="#article/${encodeURIComponent(a.id)}">
        <img src="${a.cover}" alt="" loading="lazy">
      </a>` : ""}
      <div class="log-entry-body">
        <div class="log-date">
          ${a.pinned ? '<span class="badge pinned">Épinglé</span>' : ""}
          ${formatDate(a.date)}
          ${catBadgeHtml(a)}
          ${isArchived(a) ? '<span class="badge">Archivé</span>' : ""}
        </div>
        <h2 class="log-title"><a href="#article/${encodeURIComponent(a.id)}">${escapeHtml(a.title)}</a></h2>
        <p class="log-excerpt">${escapeHtml(a.excerpt || "")}</p>
        <div class="log-meta">
          <span class="like-count">♥ <span data-like-display="${escapeHtml(a.id)}">…</span></span>
        </div>
      </div>
    </article>
  `;
}

function renderList(currentSlug = "") {
  const active = ARTICLES.filter(a => !isArchived(a));
  const shown = currentSlug ? active.filter(a => catSlug(a.category) === currentSlug) : active;
  const sorted = [...shown].sort((a, b) => {
    const pa = a.pinned ? 1 : 0, pb = b.pinned ? 1 : 0;
    if (pa !== pb) return pb - pa;
    return (a.date < b.date ? 1 : -1);
  });
  const bar = toolbarHtml(active, currentSlug);
  const mobileSettings = isMobileViewport() ? renderMobileSettings() : "";
  if (sorted.length === 0) {
    const msg = currentSlug ? "Aucun article dans cette catégorie pour l'instant." : "Aucun article publié pour l'instant.";
    app.innerHTML = mobileSettings + bar + `<p class="log-empty">${msg}</p>`;
    wireToolbar(shown);
    bindSettingsPanel();
    return;
  }
  app.innerHTML = mobileSettings + bar + `<div class="log">${sorted.map(articleCardHtml).join("")}</div>`;
  wireToolbar(shown);
  bindSettingsPanel();

  sorted.forEach(async (a) => {
    const count = await fetchLikeCount(a.id);
    updateLikeDisplays(a.id, count);
  });
}

function renderArchives() {
  const archived = ARTICLES.filter(isArchived);
  const sorted = [...archived].sort((a, b) => (a.date < b.date ? 1 : -1));
  const header = `
    <a class="article-back" href="blog.html">← Retour à l'accueil</a>
    <h1 style="font-family:var(--font-display);font-size:1.3rem;margin:0 0 20px;">Archives</h1>
  `;
  if (sorted.length === 0) {
    app.innerHTML = header + `<p class="log-empty">Aucun article archivé pour l'instant.</p>`;
    return;
  }
  app.innerHTML = header + `<div class="log">${sorted.map(articleCardHtml).join("")}</div>`;

  sorted.forEach(async (a) => {
    const count = await fetchLikeCount(a.id);
    updateLikeDisplays(a.id, count);
  });
}

function renderArticle(id) {
  const article = ARTICLES.find(a => a.id === id);
  if (!article) {
    app.innerHTML = `<p class="log-empty">Article introuvable.</p><a class="article-back" href="blog.html">← Retour à l'accueil</a>`;
    return;
  }
  app.innerHTML = `
    <div class="article-nav">
      <a class="article-back" href="blog.html">← Retour à l'accueil</a>
      <button type="button" class="tool-btn" id="randomBtn">Aléatoire</button>
    </div>
    <header class="article-header">
      <span class="log-date">${formatDate(article.date)} ${catBadgeHtml(article)}</span>
      <h1>${escapeHtml(article.title)}</h1>
    </header>
    ${article.cover ? `<figure class="block-image"><img src="${article.cover}" alt=""></figure>` : ""}
    <div class="article-body">${renderArticleBody(article)}</div>

    <div class="like-bar">
      <button type="button" class="btn like-btn" data-like-btn="${escapeHtml(article.id)}" ${hasLikedLocally(article.id) ? "disabled" : ""}>
        <span class="like-label">${hasLikedLocally(article.id) ? "♥ Aimé" : "♡ J'aime"}</span>
        <span data-like-display="${escapeHtml(article.id)}">…</span>
      </button>
    </div>
  `;

  wireLikeButton(article.id);
  const rb = document.getElementById("randomBtn");
  if (rb) rb.addEventListener("click", () => goRandom(ARTICLES.filter(a => !isArchived(a)), article.id));
  fetchLikeCount(article.id).then(count => updateLikeDisplays(article.id, count));
}

function render() {
  const hash = location.hash;
  applyMobileDisplaySettings();
  if (hash.startsWith("#article/")) {
    renderArticle(decodeURIComponent(hash.replace("#article/", "")));
  } else if (hash.startsWith("#categorie/")) {
    renderList(decodeURIComponent(hash.replace("#categorie/", "")));
  } else if (hash === "#archives") {
    renderArchives();
  } else {
    renderList();
  }
  window.scrollTo(0, 0);
  setInstallButtonState();
}

const LIKES_NAMESPACE = "ququdeveloppement-mysite";
const LIKED_LOCALLY_KEY = "atelier_liked_articles";
const NOTIFY_KEY = "atelier_notifications_enabled";
const LAST_COMMON_ARTICLE_KEY = "atelier_last_notified_article";

function hasLikedLocally(id) {
  try {
    const arr = JSON.parse(localStorage.getItem(LIKED_LOCALLY_KEY) || "[]");
    return arr.includes(id);
  } catch { return false; }
}
function markLikedLocally(id) {
  try {
    const arr = JSON.parse(localStorage.getItem(LIKED_LOCALLY_KEY) || "[]");
    if (!arr.includes(id)) arr.push(id);
    localStorage.setItem(LIKED_LOCALLY_KEY, JSON.stringify(arr));
  } catch {}
}

function getLatestArticleId() {
  if (!ARTICLES || !ARTICLES.length) return null;
  return [...ARTICLES].sort((a, b) => (a.date < b.date ? 1 : -1))[0]?.id || null;
}

function setNotificationBtnState() {
  const btn = document.getElementById("notifyToggle");
  if (!btn) return;
  btn.checked = localStorage.getItem(NOTIFY_KEY) === "1";
}

function notifyIfNewArticle() {
  if (localStorage.getItem(NOTIFY_KEY) !== "1") return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;

  const latestId = getLatestArticleId();
  const lastSeen = localStorage.getItem(LAST_COMMON_ARTICLE_KEY);
  if (!latestId || lastSeen === latestId) return;

  localStorage.setItem(LAST_COMMON_ARTICLE_KEY, latestId);
  new Notification("Nouvel article sur L'Atelier", {
    body: "Un nouveau billet vient d'être publié.",
    icon: "https://ququdeveloppement.github.io/mysite/BlogIcon.png"
  });
}

function startArticlePolling() {
  if (window.__atelierPoller) clearInterval(window.__atelierPoller);
  window.__atelierPoller = setInterval(() => notifyIfNewArticle(), 30000);
}

function bindNotificationToggle() {
  const btn = document.getElementById("notifyToggle");
  if (!btn) return;

  btn.addEventListener("change", async () => {
    if (!("Notification" in window)) {
      alert("Ce navigateur ne supporte pas les notifications Web.");
      btn.checked = false;
      localStorage.setItem(NOTIFY_KEY, "0");
      return;
    }

    if (btn.checked) {
      const result = await Notification.requestPermission();
      if (result !== "granted") {
        alert("L'autorisation de notification a été refusée. Tu peux la réactiver dans les paramètres du navigateur.");
        btn.checked = false;
        localStorage.setItem(NOTIFY_KEY, "0");
        return;
      }
      localStorage.setItem(NOTIFY_KEY, "1");
      notifyIfNewArticle();
      return;
    }

    localStorage.setItem(NOTIFY_KEY, "0");
  });

  setNotificationBtnState();
}

async function fetchLikeCount(id) {
  try {
    const res = await fetch(`https://abacus.jasoncameron.dev/get/${LIKES_NAMESPACE}/${encodeURIComponent(id)}`);
    if (!res.ok) return 0;
    const data = await res.json();
    return data.value || 0;
  } catch {
    return 0;
  }
}

async function incrementLikeCount(id) {
  const res = await fetch(`https://abacus.jasoncameron.dev/hit/${LIKES_NAMESPACE}/${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error("Service de likes indisponible pour le moment");
  const data = await res.json();
  return data.value || 0;
}

function updateLikeDisplays(id, count) {
  document.querySelectorAll(`[data-like-display="${CSS.escape(id)}"]`).forEach(el => {
    el.textContent = String(count);
  });
}

function wireLikeButton(id) {
  const btn = document.querySelector(`[data-like-btn="${CSS.escape(id)}"]`);
  if (!btn) return;
  btn.addEventListener("click", async () => {
    if (hasLikedLocally(id)) return;
    btn.disabled = true;
    try {
      const count = await incrementLikeCount(id);
      markLikedLocally(id);
      const label = btn.querySelector(".like-label");
      if (label) label.textContent = "♥ Aimé";
      updateLikeDisplays(id, count);
    } catch (e) {
      btn.disabled = false;
      alert("Impossible d'enregistrer ton like pour le moment, réessaie plus tard.");
    }
  });
}

window.addEventListener("hashchange", render);
window.addEventListener("resize", () => {
  applyMobileDisplaySettings();
  setInstallButtonState();
  setNotificationBtnState();
});
loadArticles();
</script>
