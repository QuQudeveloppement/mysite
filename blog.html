<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const app = document.getElementById("app");
let ARTICLES = [], USER_BOOKMARKS = {}, deferredPrompt = null;
const ic = (n, c = "") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const enc = encodeURIComponent;

/* ---------- Données dérivées ---------- */
function bodyText(a) {
  return (a.blocks || []).map(b => (b && (b.text || b.content || b.title)) || "").join(" ");
}
function indexOf(a) { return a._t || (a._t = norm([a.title, a.excerpt, a.category, bodyText(a)].join(" "))); }
function readTime(a) {
  const w = (bodyText(a) + " " + (a.excerpt || "")).split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(w / 200));
}
function catSlug(c) { return norm(c).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function sortArticles(list) {
  return [...list].sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || (a.date < b.date ? 1 : -1));
}
function activeArticles() { return ARTICLES.filter(a => !isArchived(a)); }
function categories(list) {
  const m = new Map();
  list.forEach(a => { if (!a.category) return; const s = catSlug(a.category); const e = m.get(s) || { label: a.category, n: 0 }; e.n++; m.set(s, e); });
  return m;
}

/* ---------- Composants ---------- */
function bkInner(on) { return ic("bookmark", on ? "fill" : ""); }
function metaHtml(a, withLikes = true) {
  return `<div class="meta">
    ${a.pinned ? `<span>${ic("pin")} À la une</span>` : ""}
    <span>${formatDate(a.date)}</span>
    <span>${ic("clock")} ${readTime(a)} min</span>
    ${withLikes ? `<span class="push">${ic("heart")} <span data-like-display="${escapeHtml(a.id)}">…</span></span>` : ""}
  </div>`;
}
function catBadge(a) {
  return a.category ? `<a class="badge cat" href="#categorie/${enc(catSlug(a.category))}">${escapeHtml(a.category)}</a>` : "";
}
function bookmarkBtn(a) {
  const on = USER_BOOKMARKS[a.id] === true;
  return `<button type="button" class="bookmark-btn ${on ? "on" : ""}" id="bk-${escapeHtml(a.id)}" data-bk="${escapeHtml(a.id)}" aria-label="${on ? "Retirer des enregistrés" : "Enregistrer l'article"}" title="Enregistrer">${bkInner(on)}</button>`;
}
function cardHtml(a) {
  return `<article class="card-a">
    ${bookmarkBtn(a)}
    ${a.cover ? `<a class="thumb" href="#article/${enc(a.id)}"><img src="${a.cover}" alt="" loading="lazy"></a>` : ""}
    <div class="body">
      <div>${catBadge(a)}</div>
      <h3><a href="#article/${enc(a.id)}">${escapeHtml(a.title)}</a></h3>
      <p>${escapeHtml(a.excerpt || "")}</p>
      ${metaHtml(a)}
    </div>
  </article>`;
}
function fillLikes(list) {
  list.forEach(async a => updateLikeDisplays(a.id, await fetchLikeCount(a.id)));
}
function searchForm(q = "") {
  return `<form class="searchbar" id="homeSearch" role="search">
    <input type="search" id="homeQ" value="${escapeHtml(q)}" placeholder="Rechercher un article, une rubrique, un sujet..." aria-label="Rechercher">
    <button class="btn btn-primary" type="submit">${ic("search")}Rechercher</button>
  </form>`;
}
function wireSearchForm() {
  const f = document.getElementById("homeSearch");
  if (f) f.onsubmit = e => { e.preventDefault(); location.hash = "#recherche/" + enc(document.getElementById("homeQ").value.trim()); };
}
function chipsHtml(active, current) {
  const cats = categories(active);
  const saved = Object.values(USER_BOOKMARKS).filter(Boolean).length;
  let h = `<a class="cat-chip ${!current ? "active" : ""}" href="#tout">Tout <span class="cat-n">${active.length}</span></a>`;
  h += `<a class="cat-chip ${current === "enregistres" ? "active" : ""}" href="#categorie/enregistres">${ic("bookmark")} Enregistrés <span class="cat-n">${saved}</span></a>`;
  [...cats.entries()].sort((x, y) => y[1].n - x[1].n).forEach(([s, e]) => {
    h += `<a class="cat-chip ${s === current ? "active" : ""}" href="#categorie/${enc(s)}">${escapeHtml(e.label)} <span class="cat-n">${e.n}</span></a>`;
  });
  return `<div class="chips">${h}</div>`;
}
function goRandom(excludeId = "") {
  const pool = activeArticles().filter(a => a.id !== excludeId);
  if (!pool.length) return;
  location.hash = "#article/" + enc(pool[Math.floor(Math.random() * pool.length)].id);
}

/* ---------- Vues ---------- */
function renderHome() {
  const list = sortArticles(activeArticles());
  const cats = categories(list);
  const today = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  let h = `<div class="masthead"><span>${today}</span><span>${list.length} articles · ${cats.size} rubriques</span></div>` + searchForm();
  if (!list.length) { app.innerHTML = h + `<p class="log-empty">Aucun article publié pour l'instant.</p>`; wireSearchForm(); return; }

  const lead = list[0], side = list.slice(1, 6);
  h += `<section class="front">
    <article class="lead">
      ${bookmarkBtn(lead)}
      ${lead.cover ? `<a class="lead-img" href="#article/${enc(lead.id)}"><img src="${lead.cover}" alt=""></a>` : ""}
      <div style="margin-top:14px">${catBadge(lead)}</div>
      <h2><a href="#article/${enc(lead.id)}">${escapeHtml(lead.title)}</a></h2>
      <p>${escapeHtml(lead.excerpt || "")}</p>
      ${metaHtml(lead)}
    </article>
    <aside class="front-side">
      <h2 class="sec-title" style="margin-top:0">Dernières publications</h2>
      <ol>${side.map(a => `<li><div><a class="t" href="#article/${enc(a.id)}">${escapeHtml(a.title)}</a>${metaHtml(a, false)}</div></li>`).join("")}</ol>
    </aside>
  </section>`;

  const shown = new Set([lead.id, ...side.map(a => a.id)]);
  [...cats.entries()].sort((x, y) => y[1].n - x[1].n).slice(0, 4).forEach(([s, e]) => {
    const items = list.filter(a => catSlug(a.category) === s).slice(0, 3);
    h += `<h2 class="sec-title"><span>${escapeHtml(e.label)}</span><a href="#categorie/${enc(s)}">Toute la rubrique ${ic("right")}</a></h2>
      <div class="grid">${items.map(cardHtml).join("")}</div>`;
  });
  h += `<h2 class="sec-title"><span>Récemment publiés</span><a href="#tout">Tous les articles ${ic("right")}</a></h2>
    <div class="grid">${list.filter(a => !shown.has(a.id)).slice(0, 6).map(cardHtml).join("") || ""}</div>
    <p style="margin-top:28px"><button type="button" class="btn" id="randomBtn">${ic("shuffle")}Article aléatoire</button></p>`;
  app.innerHTML = h;
  wireSearchForm();
  document.getElementById("randomBtn").onclick = () => goRandom();
  fillLikes(list);
}

function renderList(slug = "") {
  const active = activeArticles();
  let shown = active, title = "Tous les articles";
  if (slug === "enregistres") { shown = active.filter(a => USER_BOOKMARKS[a.id] === true); title = "Articles enregistrés"; }
  else if (slug) { shown = active.filter(a => catSlug(a.category) === slug); title = categories(active).get(slug)?.label || "Rubrique"; }
  shown = sortArticles(shown);
  const empty = slug === "enregistres" ? "Aucun article enregistré pour l'instant." : "Aucun article dans cette rubrique pour l'instant.";
  app.innerHTML = `<a class="back" href="#">${ic("left")} Accueil</a><h1 class="page-title">${escapeHtml(title)}</h1>` +
    searchForm() + chipsHtml(active, slug) +
    (shown.length ? `<div class="grid">${shown.map(cardHtml).join("")}</div>` : `<p class="log-empty">${empty}</p>`);
  wireSearchForm();
  fillLikes(shown);
}

function renderArchives() {
  const list = [...ARTICLES.filter(isArchived)].sort((a, b) => (a.date < b.date ? 1 : -1));
  app.innerHTML = `<a class="back" href="#">${ic("left")} Accueil</a><h1 class="page-title">Archives</h1>` +
    (list.length ? `<div class="grid">${list.map(cardHtml).join("")}</div>` : `<p class="log-empty">Aucun article archivé pour l'instant.</p>`);
  fillLikes(list);
}

function renderSearch(q = "") {
  const cats = [...categories(ARTICLES).entries()].sort((x, y) => x[1].label.localeCompare(y[1].label, "fr"));
  app.innerHTML = `<a class="back" href="#">${ic("left")} Accueil</a><h1 class="page-title">Recherche</h1>
    <div class="searchbar">
      <input type="search" id="sq" value="${escapeHtml(q)}" placeholder="Titre, contenu, rubrique..." aria-label="Rechercher" autocomplete="off">
    </div>
    <div class="sfilters">
      <select id="sc" aria-label="Rubrique"><option value="">Toutes les rubriques</option>${cats.map(([s, e]) => `<option value="${escapeHtml(s)}">${escapeHtml(e.label)}</option>`).join("")}</select>
      <select id="ss" aria-label="Tri"><option value="rel">Pertinence</option><option value="new">Plus récents</option><option value="old">Plus anciens</option></select>
      <label class="meta" style="align-self:center"><input type="checkbox" id="sa"> Inclure les archives</label>
    </div>
    <p class="meta" id="sn" aria-live="polite"></p><div id="sr"></div>`;
  const $ = id => document.getElementById(id);
  const run = () => {
    const terms = norm($("sq").value).split(/\s+/).filter(Boolean);
    const cat = $("sc").value, mode = $("ss").value, arch = $("sa").checked;
    let res = ARTICLES.filter(a => (arch || !isArchived(a)) && (!cat || catSlug(a.category) === cat) && terms.every(t => indexOf(a).includes(t)));
    const score = a => terms.reduce((s, t) => s + (norm(a.title).includes(t) ? 3 : 0) + (norm(a.category).includes(t) ? 2 : 0) + (norm(a.excerpt).includes(t) ? 1 : 0), 0);
    if (mode === "new") res.sort((a, b) => (a.date < b.date ? 1 : -1));
    else if (mode === "old") res.sort((a, b) => (a.date > b.date ? 1 : -1));
    else res.sort((a, b) => score(b) - score(a) || (a.date < b.date ? 1 : -1));
    $("sn").textContent = terms.length || cat ? `${res.length} résultat${res.length > 1 ? "s" : ""}` : `${res.length} articles`;
    $("sr").innerHTML = res.length ? `<div class="grid">${res.map(cardHtml).join("")}</div>` : `<p class="log-empty">Aucun résultat. Essayez d'autres mots-clés.</p>`;
    fillLikes(res);
    history.replaceState(null, "", "#recherche" + (terms.length ? "/" + enc($("sq").value.trim()) : ""));
  };
  ["input", "change"].forEach(ev => ["sq", "sc", "ss", "sa"].forEach(id => $(id).addEventListener(ev, run)));
  run();
  $("sq").focus();
}

async function renderSettings() {
  const user = firebase.auth().currentUser, logged = user && !user.isAnonymous;
  let pseudo = "Non connecté", mail = "Non connecté";
  if (logged) {
    mail = user.email || "Compte Google vérifié";
    pseudo = (await fbDb.ref(`users/${user.uid}/profile/pseudo`).once("value")).val() || "Membre";
  }
  app.innerHTML = `<a class="back" href="#">${ic("left")} Accueil</a><h1 class="page-title">Paramètres et confidentialité</h1>
    <div class="panel"><h3>Profil</h3>
      <p>Statut : <strong>${logged ? "Connecté via Google" : "Visiteur"}</strong></p>
      <p>Email : <strong>${escapeHtml(mail)}</strong></p>
      <p>Pseudonyme : <strong>${escapeHtml(pseudo)}</strong></p>
      ${logged ? `<button type="button" class="btn" id="changePseudoBtn">Modifier mon pseudo</button>` : `<p>Connectez-vous pour personnaliser votre profil, commenter et enregistrer des articles.</p>`}
      <h3 style="margin-top:26px">Confidentialité</h3>
      <p>Vos favoris et commentaires sont stockés dans votre espace Firebase Realtime Database. Rien n'est transmis à des tiers.</p>
    </div>`;
  const b = document.getElementById("changePseudoBtn");
  if (b) b.onclick = async () => {
    const p = prompt("Nouveau pseudonyme (30 caractères max) :", pseudo);
    if (p && p.trim()) { await fbDb.ref(`users/${user.uid}/profile/pseudo`).set(p.trim().slice(0, 30)); renderSettings(); }
  };
}

function renderArticle(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) { app.innerHTML = `<p class="log-empty">Article introuvable.</p><a class="back" href="#">${ic("left")} Accueil</a>`; return; }
  app.innerHTML = `<div class="article-bar"><a class="back" href="#">${ic("left")} Accueil</a>
      <button type="button" class="btn" id="randomBtn">${ic("shuffle")}Aléatoire</button></div>
    <header class="article-header" style="margin-top:20px">
      <div class="meta" style="margin-bottom:10px">${catBadge(a)}<span>${formatDate(a.date)}</span><span>${ic("clock")} ${readTime(a)} min de lecture</span></div>
      <h1>${escapeHtml(a.title)}</h1>
    </header>
    ${a.cover ? `<figure class="block-image"><img src="${a.cover}" alt=""></figure>` : ""}
    <div class="article-body">${renderArticleBody(a)}</div>
    <div class="like-bar" style="display:flex;gap:10px;flex-wrap:wrap">
      <button type="button" class="btn like-btn" data-like-btn="${escapeHtml(a.id)}" disabled>${ic("heart")}<span class="like-label">J'aime</span> <span data-like-display="${escapeHtml(a.id)}">…</span></button>
      <button type="button" class="btn" data-bk="${escapeHtml(a.id)}" id="bk-${escapeHtml(a.id)}">${bkInner(USER_BOOKMARKS[a.id] === true)} Enregistrer</button>
    </div>
    <section class="comments"><h3>Commentaires</h3><div id="commentsList"></div><div id="commentFormContainer"></div></section>`;
  wireLikeButton(a.id);
  document.getElementById("randomBtn").onclick = () => goRandom(a.id);
  fetchLikeCount(a.id).then(c => updateLikeDisplays(a.id, c));
  loadComments(id);
}

function render() {
  const h = location.hash;
  document.querySelectorAll(".nav-link").forEach(l => l.classList.remove("on"));
  const on = id => document.getElementById(id).classList.add("on");
  if (h.startsWith("#article/")) renderArticle(decodeURIComponent(h.slice(9)));
  else if (h.startsWith("#categorie/")) renderList(decodeURIComponent(h.slice(11)));
  else if (h.startsWith("#recherche")) renderSearch(decodeURIComponent(h.slice(11)));
  else if (h === "#tout") { on("nvAll"); renderList(); }
  else if (h === "#archives") { on("nvArch"); renderArchives(); }
  else if (h === "#parametres") renderSettings();
  else { on("nvHome"); renderHome(); }
  window.scrollTo(0, 0);
}

async function loadArticles() {
  try {
    const r = await fetch("articles.json", { cache: "no-store" });
    if (!r.ok) throw new Error("articles.json introuvable");
    ARTICLES = await r.json();
  } catch (e) {
    app.innerHTML = `<p class="log-empty">Impossible de charger les articles (${escapeHtml(e.message)}).</p>`;
    return;
  }
  if (localStorage.getItem(LAST_KEY) === null && latestId()) localStorage.setItem(LAST_KEY, latestId());
  notifyIfNew();
  setInterval(notifyIfNew, 30000);
  render();
}

/* ---------- Notifications, installation, raccourci recherche ---------- */
const NOTIFY_KEY = "atelier_notifications_enabled", LAST_KEY = "atelier_last_notified_article";
const notifyBtn = document.getElementById("notifyToggle"), installBtn = document.getElementById("installAppBtn");
const latestId = () => [...ARTICLES].sort((a, b) => (a.date < b.date ? 1 : -1))[0]?.id || null;
function notifyState() {
  const ok = "Notification" in window;
  notifyBtn.hidden = !ok;
  const on = ok && Notification.permission === "granted" && localStorage.getItem(NOTIFY_KEY) === "1";
  notifyBtn.setAttribute("aria-pressed", String(on));
  notifyBtn.title = on ? "Notifications activées (cliquer pour désactiver)" : "Activer les notifications";
  notifyBtn.style.color = on ? "var(--amber)" : "";
}
function notifyIfNew() {
  if (localStorage.getItem(NOTIFY_KEY) !== "1" || !("Notification" in window) || Notification.permission !== "granted") return;
  const id = latestId();
  if (!id || localStorage.getItem(LAST_KEY) === id) return;
  localStorage.setItem(LAST_KEY, id);
  new Notification("Nouvel article sur L'Atelier", { body: "Un nouveau billet vient d'être publié.", icon: "https://ququdeveloppement.github.io/mysite/BlogIcon.png" });
}
notifyBtn.addEventListener("click", async () => {
  if (localStorage.getItem(NOTIFY_KEY) === "1") { localStorage.setItem(NOTIFY_KEY, "0"); notifyState(); return; }
  if (await Notification.requestPermission() !== "granted") { alert("L'autorisation de notification a été refusée."); return; }
  localStorage.setItem(NOTIFY_KEY, "1"); notifyState(); notifyIfNew();
});
notifyState();
installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt = null; installBtn.hidden = true;
});
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; installBtn.hidden = false; });
window.addEventListener("appinstalled", () => { deferredPrompt = null; installBtn.hidden = true; });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); location.hash = "#recherche"; }
});

const fbDb = firebase.database();
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const likeKey = id => String(id).replace(/[.#$\[\]\/]/g, "_").slice(0, 100);

let authPromise = null;
function ensureAuth() {
  const u = firebase.auth().currentUser;
  if (u) return Promise.resolve(u);
  if (!authPromise) {
    authPromise = new Promise((resolve, reject) => {
      const unsub = firebase.auth().onAuthStateChanged(user => { if (user) { unsub(); resolve(user); } });
      firebase.auth().signInAnonymously().catch(reject);
    }).catch(err => { authPromise = null; throw err; });
  }
  return authPromise;
}

const loginBtn = document.getElementById("loginBtn");
function setLoginUi(pseudo) {
  loginBtn.innerHTML = pseudo ? `${ic("logout")}<span>${escapeHtml(pseudo)}</span>` : `${ic("login")}<span>Connexion</span>`;
  loginBtn.title = pseudo ? `Déconnexion (${pseudo})` : "Connexion";
}
loginBtn.addEventListener("click", async () => {
  const u = firebase.auth().currentUser;
  try {
    if (u && !u.isAnonymous) await firebase.auth().signOut();
    else await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
  } catch (e) { console.error(e); alert("Opération impossible pour le moment."); }
});

let bkRef = null;
firebase.auth().onAuthStateChanged(async user => {
  if (bkRef) { bkRef.off(); bkRef = null; }
  if (user && !user.isAnonymous) {
    const pref = fbDb.ref(`users/${user.uid}/profile/pseudo`);
    let pseudo = (await pref.once("value")).val();
    if (!pseudo) {
      const def = user.displayName ? user.displayName.split(" ")[0] : "Membre";
      pseudo = (prompt("Choisis ton pseudonyme pour commenter et enregistrer tes favoris :", def) || "Anonyme").trim();
      await pref.set(pseudo);
    }
    setLoginUi(pseudo);
    bkRef = fbDb.ref(`users/${user.uid}/bookmarks`);
    bkRef.on("value", s => {
      USER_BOOKMARKS = s.val() || {};
      updateBookmarkUI();
      if (location.hash === "#categorie/enregistres") renderList("enregistres");
    });
  } else {
    setLoginUi("");
    USER_BOOKMARKS = {};
    updateBookmarkUI();
    if (location.hash === "#categorie/enregistres") renderList("enregistres");
  }
  if (location.hash.startsWith("#article/")) loadComments(decodeURIComponent(location.hash.slice(9)));
});

/* ---------- Favoris ---------- */
function updateBookmarkUI() {
  document.querySelectorAll("[data-bk]").forEach(b => {
    const on = USER_BOOKMARKS[b.dataset.bk] === true;
    const text = b.classList.contains("bookmark-btn") ? "" : " Enregistrer";
    b.innerHTML = bkInner(on) + text;
    b.classList.toggle("on", on);
    b.setAttribute("aria-label", on ? "Retirer des enregistrés" : "Enregistrer l'article");
  });
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-bk]");
  if (!b) return;
  const user = firebase.auth().currentUser;
  if (!user || user.isAnonymous) { alert("Connectez-vous avec Google pour enregistrer des articles."); return; }
  const ref = fbDb.ref(`users/${user.uid}/bookmarks/${b.dataset.bk}`);
  try { (await ref.once("value")).exists() ? await ref.remove() : await ref.set(true); }
  catch (err) { console.error(err); alert("Impossible de modifier les favoris."); }
});

/* ---------- Commentaires ---------- */
async function loadComments(articleId) {
  const list = document.getElementById("commentsList"), form = document.getElementById("commentFormContainer");
  if (!list || !form) return;
  const user = firebase.auth().currentUser;
  if (user && !user.isAnonymous) {
    form.innerHTML = `<form id="commentForm"><textarea id="commentInput" placeholder="Écrire un commentaire..." required></textarea><button type="submit" class="btn">Publier le commentaire</button></form>`;
    document.getElementById("commentForm").onsubmit = async e => {
      e.preventDefault();
      const text = document.getElementById("commentInput").value.trim();
      if (!text) return;
      try {
        const pseudo = (await fbDb.ref(`users/${user.uid}/profile/pseudo`).once("value")).val() || "Membre";
        await fbDb.ref(`comments/${likeKey(articleId)}`).push().set({ author: pseudo, text, date: Date.now() });
        loadComments(articleId);
      } catch (err) { console.error(err); alert("Impossible d'envoyer le commentaire."); }
    };
  } else form.innerHTML = `<p class="field-hint">Connectez-vous avec Google pour poster un commentaire.</p>`;
  try {
    const c = (await fbDb.ref(`comments/${likeKey(articleId)}`).once("value")).val();
    list.innerHTML = c ? Object.values(c).sort((a, b) => b.date - a.date).map(x => `<div class="comment">
      <div class="meta"><strong>${escapeHtml(x.author)}</strong><span>${new Date(x.date).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span></div>
      <p>${escapeHtml(x.text)}</p></div>`).join("") : `<p class="field-hint">Aucun commentaire pour l'instant.</p>`;
  } catch { list.innerHTML = `<p class="field-hint">Erreur de chargement des commentaires.</p>`; }
}

/* ---------- Likes ---------- */
async function fetchLikeCount(id) {
  try { return (await fbDb.ref(`likes/${likeKey(id)}/count`).once("value")).val() || 0; } catch { return 0; }
}
async function hasLiked(id) {
  try { const u = await ensureAuth(); return (await fbDb.ref(`likes/${likeKey(id)}/voters/${u.uid}`).once("value")).exists(); } catch { return false; }
}
async function incrementLikeCount(id) {
  const u = await ensureAuth(), k = likeKey(id), ref = fbDb.ref(`likes/${k}/count`);
  for (let i = 0; i < 4; i++) {
    const next = ((await ref.once("value")).val() || 0) + 1;
    try { await fbDb.ref().update({ [`likes/${k}/count`]: next, [`likes/${k}/voters/${u.uid}`]: true }); return next; }
    catch (e) { if (i === 3) throw e; }
  }
}
function updateLikeDisplays(id, n) {
  document.querySelectorAll(`[data-like-display="${CSS.escape(id)}"]`).forEach(el => el.textContent = String(n));
}
function setLikedState(btn, liked) {
  btn.querySelector(".like-label").textContent = liked ? "Aimé" : "J'aime";
  btn.classList.toggle("liked", liked);
  btn.disabled = liked;
}
async function wireLikeButton(id) {
  const btn = document.querySelector(`[data-like-btn="${CSS.escape(id)}"]`);
  if (!btn) return;
  setLikedState(btn, await hasLiked(id));
  btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    try { const n = await incrementLikeCount(id); setLikedState(btn, true); updateLikeDisplays(id, n); }
    catch (e) { console.error(e); btn.disabled = false; alert("Impossible d'enregistrer ton like, réessaie plus tard."); }
  });
}

window.addEventListener("hashchange", render);
loadArticles();
