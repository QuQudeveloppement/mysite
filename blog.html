    .site-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

      .mobile-home h1 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.5rem); line-height: 1.1; }
      .mobile-home p { margin: 0; opacity: .85; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
const app = document.getElementById("app");
let ARTICLES = [];
let deferredPrompt = null;
let USER_BOOKMARKS = {};

const notifyToggle = document.getElementById("notifyToggle");
const installAppBtn = document.getElementById("installAppBtn");
const loginBtn = document.getElementById("loginBtn");

function isMobile() {
  return window.matchMedia("(max-width: 768px)").matches;
}

function isStandalone() {
  return (
    window.matchMedia("(display-mode: standalone)").matches ||
    ("standalone" in window.navigator && window.navigator.standalone === true)
  );
}

function updateNotificationState() {
  if (!notifyToggle) return;
  const supported = "Notification" in window;
  const granted = supported && Notification.permission === "granted";
  notifyToggle.hidden = granted;
  notifyToggle.setAttribute("aria-pressed", String(granted));
  notifyToggle.textContent = granted ? "Notifications activées" : "Notifications";
  if (!supported) notifyToggle.hidden = true;
}

function updateInstallState() {
  if (!installAppBtn) return;
  const mobile = isMobile();
  const installed = isStandalone();
  if (!mobile || installed || !deferredPrompt) {
    installAppBtn.hidden = true;
    return;
  }
  installAppBtn.hidden = false;
}

if (notifyToggle) {
  updateNotificationState();
  notifyToggle.addEventListener("click", async () => {
    if (!("Notification" in window)) {
      alert("Ce navigateur ne supporte pas les notifications Web.");
      return;
    }
    if (Notification.permission === "granted") {
      updateNotificationState();
      return;
    }
    const result = await Notification.requestPermission();
    if (result === "granted") {
      updateNotificationState();
    } else {
      alert("L'autorisation de notification a été refusée.");
    }
  });
}

if (installAppBtn) {
  installAppBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice.outcome === "accepted") {
      installAppBtn.hidden = true;
    }
    deferredPrompt = null;
    updateInstallState();
  });
}

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredPrompt = event;
  updateInstallState();
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  updateInstallState();
});

window.addEventListener("resize", updateInstallState);
updateNotificationState();
updateInstallState();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

async function loadArticles() {
  try {
    const res = await fetch("articles.json", { cache: "no-store" });
    if (!res.ok) throw new Error("Fichier articles.json introuvable");
    ARTICLES = await res.json();
  } catch (e) {
    ARTICLES = [];
    app.innerHTML = `<p class="log-empty">Impossible de charger les articles (${escapeHtml(e.message)}).</p>`;
    return;
  }
  bindNotificationToggle();
  if (localStorage.getItem(LAST_COMMON_ARTICLE_KEY) === null && getLatestArticleId()) {
    localStorage.setItem(LAST_COMMON_ARTICLE_KEY, getLatestArticleId());
  }
  notifyIfNewArticle();
  startArticlePolling();
  render();
}

function catSlug(c) {
  return String(c || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function catBadgeHtml(a) {
  if (!a.category) return "";
  return `<a class="badge cat" href="#categorie/${encodeURIComponent(catSlug(a.category))}">${escapeHtml(a.category)}</a>`;
}

function collectCategories(active) {
  const cats = new Map();
  active.forEach(a => {
    if (!a.category) return;
    const s = catSlug(a.category);
    const entry = cats.get(s) || { label: a.category, n: 0 };
    entry.n++;
    cats.set(s, entry);
  });
  return cats;
}

function toolbarHtml(active, current) {
  const cats = collectCategories(active);
  const label = current && cats.has(current) ? " : " + cats.get(current).label : (current === "enregistres" ? " : Articles enregistrés" : "");
  const savedCount = Object.values(USER_BOOKMARKS).filter(Boolean).length;
  
  const isAllActive = !current;
  const isSavedActive = current === "enregistres";

  let chips = `<a class="cat-chip ${isAllActive ? "active" : ""}" href="#">Tout <span class="cat-n">${active.length}</span></a>`;
  chips += `<a class="cat-chip ${isSavedActive ? "active" : ""}" href="#categorie/enregistres">[📁] Articles enregistrés <span class="cat-n">${savedCount}</span></a>`;

  if (cats.size > 0) {
    chips += [...cats.entries()]
      .sort((x, y) => x[1].label.localeCompare(y[1].label, "fr"))
      .map(([s, e]) => `<a class="cat-chip ${s === current ? "active" : ""}" href="#categorie/${encodeURIComponent(s)}">${escapeHtml(e.label)} <span class="cat-n">${e.n}</span></a>`)
      .join("");
  }

  return `
    <div class="toolbar">
      <button type="button" class="tool-btn" id="catToggle" aria-expanded="false" aria-controls="catPanel">Catégories${escapeHtml(label)}</button>
      <button type="button" class="tool-btn" id="randomBtn">Aléatoire</button>
    </div>
    <div class="cat-panel" id="catPanel" hidden>${chips}</div>`;
}

function goRandom(list, excludeId = "") {
  const pool = list.filter(a => a.id !== excludeId);
  const choices = pool.length ? pool : list;
  if (choices.length === 0) return;
  const pick = choices[Math.floor(Math.random() * choices.length)];
  location.hash = "#article/" + encodeURIComponent(pick.id);
}

function wireToolbar(list) {
  const toggle = document.getElementById("catToggle");
  const panel = document.getElementById("catPanel");
  if (toggle && panel) {
    toggle.addEventListener("click", () => {
      const opening = panel.hasAttribute("hidden");
      if (opening) panel.removeAttribute("hidden"); else panel.setAttribute("hidden", "");
      toggle.setAttribute("aria-expanded", String(opening));
    });
  }
  const rnd = document.getElementById("randomBtn");
  if (rnd) rnd.addEventListener("click", () => goRandom(list));
}

function articleCardHtml(a) {
  const isBookmarked = USER_BOOKMARKS[a.id] === true;
  // Utilisation de symboles filaires en bâtons propres alignés sur une seule ligne
  const bookmarkSymbol = isBookmarked ? "[ / ] Enregistré" : "[ + ] Enregistrer";
  return `
    <article class="log-entry ${a.cover ? "has-cover" : ""}">
      <button class="bookmark-btn" onclick="toggleBookmark('${a.id}')" id="bk-${a.id}" title="Sauvegarder">${bookmarkSymbol}</button>
      ${a.cover ? `<a class="log-thumb" href="#article/${encodeURIComponent(a.id)}">
        <img src="${a.cover}" alt="" loading="lazy">
      </a>` : ""}
      <div class="log-entry-body">
        <div class="log-date">
          ${a.pinned ? '<span class="badge pinned">📌 Épinglé</span>' : ""}
          ${formatDate(a.date)}
          ${catBadgeHtml(a)}
          ${isArchived(a) ? '<span class="badge">Archivé</span>' : ""}
        </div>
        <h2 class="log-title"><a href="#article/${encodeURIComponent(a.id)}">${escapeHtml(a.title)}</a></h2>
        <p class="log-excerpt">${escapeHtml(a.excerpt || "")}</p>
        <div class="log-meta">
          <span class="like-count">♥ <span data-like-display="${escapeHtml(a.id)}">…</span></span>
        </div>
      </div>
    </article>
  `;
}

function renderList(currentSlug = "") {
  const active = ARTICLES.filter(a => !isArchived(a));
  let shown = active;

  if (currentSlug === "enregistres") {
    shown = active.filter(a => USER_BOOKMARKS[a.id] === true);
  } else if (currentSlug) {
    shown = active.filter(a => catSlug(a.category) === currentSlug);
  }

  const sorted = [...shown].sort((a, b) => {
    const pa = a.pinned ? 1 : 0, pb = b.pinned ? 1 : 0;
    if (pa !== pb) return pb - pa;
    return (a.date < b.date ? 1 : -1);
  });
  const bar = toolbarHtml(active, currentSlug);

  if (sorted.length === 0) {
    const msg = currentSlug === "enregistres" 
      ? "Aucun article enregistré pour l'instant." 
      : (currentSlug ? "Aucun article dans cette catégorie pour l'instant." : "Aucun article publié pour l'instant.");
    app.innerHTML = bar + `<p class="log-empty">${msg}</p>`;
    wireToolbar(shown);
    return;
  }

  app.innerHTML = bar + `<div class="log">${sorted.map(articleCardHtml).join("")}</div>`;
  wireToolbar(shown);

  sorted.forEach(async (a) => {
    const count = await fetchLikeCount(a.id);
    updateLikeDisplays(a.id, count);
  });
}

function renderArchives() {
  const archived = ARTICLES.filter(isArchived);
  const sorted = [...archived].sort((a, b) => (a.date < b.date ? 1 : -1));
  const header = `
    <a class="article-back" href="blog.html">← Retour à l'accueil</a>
    <h1 style="font-family:var(--font-display);font-size:1.3rem;margin:0 0 20px;">Archives</h1>
  `;

  if (sorted.length === 0) {
    app.innerHTML = header + `<p class="log-empty">Aucun article archivé pour l'instant.</p>`;
    return;
  }

  app.innerHTML = header + `<div class="log">${sorted.map(articleCardHtml).join("")}</div>`;

  sorted.forEach(async (a) => {
    const count = await fetchLikeCount(a.id);
    updateLikeDisplays(a.id, count);
  });
}

function renderArticle(id) {
  const article = ARTICLES.find(a => a.id === id);

  if (!article) {
    app.innerHTML = `<p class="log-empty">Article introuvable.</p><a class="article-back" href="blog.html">← Retour à l'accueil</a>`;
    return;
  }

  app.innerHTML = `
    <div class="article-nav">
      <a class="article-back" href="blog.html">← Retour à l'accueil</a>
      <button type="button" class="tool-btn" id="randomBtn">Aléatoire</button>
    </div>
    <header class="article-header">
      <span class="log-date">${formatDate(article.date)} ${catBadgeHtml(article)}</span>
      <h1>${escapeHtml(article.title)}</h1>
    </header>
    ${article.cover ? `<figure class="block-image"><img src="${article.cover}" alt=""></figure>` : ""}
    <div class="article-body">${renderArticleBody(article)}</div>

    <div class="like-bar">
      <button type="button" class="btn like-btn" data-like-btn="${escapeHtml(article.id)}" disabled>
        <span class="like-label">♡ J'aime</span>
        <span data-like-display="${escapeHtml(article.id)}">…</span>
      </button>
    </div>

    <section class="comments-section" style="margin-top: 40px; border-top: 1px solid rgba(127,127,127,0.3); padding-top: 20px;">
      <h3>Commentaires</h3>
      <div id="commentsList" style="margin-bottom: 20px;"><p style="opacity:0.7;">Chargement des commentaires...</p></div>
      <div id="commentFormContainer"></div>
    </section>
  `;

  wireLikeButton(article.id);
  const rb = document.getElementById("randomBtn");
  if (rb) rb.addEventListener("click", () => goRandom(ARTICLES.filter(a => !isArchived(a)), article.id));
  fetchLikeCount(article.id).then(count => updateLikeDisplays(article.id, count));
  loadComments(id);
}

function render() {
  const hash = location.hash;
  if (hash.startsWith("#article/")) {
    renderArticle(decodeURIComponent(hash.replace("#article/", "")));
  } else if (hash.startsWith("#categorie/")) {
    renderList(decodeURIComponent(hash.replace("#categorie/", "")));
  } else if (hash === "#archives") {
    renderArchives();
  } else {
    renderList();
  }
  window.scrollTo(0, 0);
}

const NOTIFY_KEY = "atelier_notifications_enabled";
const LAST_COMMON_ARTICLE_KEY = "atelier_last_notified_article";

function getLatestArticleId() {
  if (!ARTICLES || !ARTICLES.length) return null;
  return [...ARTICLES].sort((a, b) => (a.date < b.date ? 1 : -1))[0]?.id || null;
}

function setNotificationBtnState() {
  const btn = document.getElementById("notifyToggle");
  if (!btn) return;
  btn.textContent = "Notifications";
  btn.setAttribute("aria-pressed", String(localStorage.getItem(NOTIFY_KEY) === "1"));
}

function notifyIfNewArticle() {
  if (localStorage.getItem(NOTIFY_KEY) !== "1") return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;

  const latestId = getLatestArticleId();
  const lastSeen = localStorage.getItem(LAST_COMMON_ARTICLE_KEY);
  if (!latestId || lastSeen === latestId) return;

  localStorage.setItem(LAST_COMMON_ARTICLE_KEY, latestId);
  new Notification("Nouvel article sur L'Atelier", {
    body: "Un nouveau billet vient d'être publié.",
    icon: "https://ququdeveloppement.github.io/mysite/BlogIcon.png"
  });
}

function startArticlePolling() {
  if (window.__atelierPoller) clearInterval(window.__atelierPoller);
  window.__atelierPoller = setInterval(() => notifyIfNewArticle(), 30000);
}

function bindNotificationToggle() {
  const btn = document.getElementById("notifyToggle");
  if (!btn) return;

  btn.addEventListener("click", async () => {
    if (!("Notification" in window)) {
      alert("Ce navigateur ne supporte pas les notifications Web.");
      return;
    }

    const enabled = localStorage.getItem(NOTIFY_KEY) === "1";
    if (!enabled) {
      const result = await Notification.requestPermission();
      if (result !== "granted") {
        alert("L'autorisation de notification a été refusée.");
        return;
      }
      localStorage.setItem(NOTIFY_KEY, "1");
      setNotificationBtnState();
      notifyIfNewArticle();
      return;
    }

    localStorage.setItem(NOTIFY_KEY, "0");
    setNotificationBtnState();
  });

  setNotificationBtnState();
}

firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();

firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

function likeKey(id) {
  return String(id).replace(/[.#$\[\]\/]/g, "_").slice(0, 100);
}

let authPromise = null;
function ensureAuth() {
  const currentUser = firebase.auth().currentUser;
  if (currentUser) return Promise.resolve(currentUser);
  if (!authPromise) {
    authPromise = new Promise((resolve, reject) => {
      const auth = firebase.auth();
      const unsub = auth.onAuthStateChanged(user => {
        if (user) { unsub(); resolve(user); }
      });
      auth.signInAnonymously().catch(reject);
    }).catch(err => { authPromise = null; throw err; });
  }
  return authPromise;
}

if (loginBtn) {
  loginBtn.addEventListener("click", async () => {
    const user = firebase.auth().currentUser;
    if (user && !user.isAnonymous) {
      try {
        await firebase.auth().signOut();
      } catch (e) {
        console.error("Erreur déconnexion :", e);
      }
    } else {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await firebase.auth().signInWithPopup(provider);
      } catch (e) {
        console.error("Erreur connexion Google :", e);
        alert("Impossible de se connecter avec Google.");
      }
    }
  });
}

firebase.auth().onAuthStateChanged(async user => {
  if (user && !user.isAnonymous) {
    const userRef = fbDb.ref(`users/${user.uid}/profile/pseudo`);
    const snap = await userRef.once("value");
    let pseudo = snap.val();

    if (!pseudo) {
      const defaultName = user.displayName ? user.displayName.split(" ")[0] : "Membre";
      pseudo = prompt("Choisis ton pseudonyme pour commenter et enregistrer tes favoris :", defaultName);
      pseudo = pseudo ? pseudo.trim() : "Anonyme";
      await userRef.set(pseudo);
    }

    if (loginBtn) {
      loginBtn.textContent = `🚪❌ (${pseudo})`;
      loginBtn.title = `Déconnexion (${pseudo})`;
    }

    fbDb.ref(`users/${user.uid}/bookmarks`).on("value", snapshot => {
      USER_BOOKMARKS = snapshot.val() || {};
      updateBookmarkUI();
      if (location.hash.startsWith("#categorie/enregistres")) {
        renderList("enregistres");
      }
    });

  } else {
    if (loginBtn) {
      loginBtn.textContent = "🚪➔";
      loginBtn.title = "Connexion";
    }
    USER_BOOKMARKS = {};
    resetBookmarkUI();
    if (location.hash.startsWith("#categorie/enregistres")) {
      renderList("enregistres");
    }
  }

  const hash = location.hash;
  if (hash.startsWith("#article/")) {
    loadComments(decodeURIComponent(hash.replace("#article/", "")));
  }
});

/* ---------- Gestion des Favoris (Bookmarks) ---------- */

function updateBookmarkUI() {
  document.querySelectorAll(".bookmark-btn").forEach(btn => {
    const id = btn.id.replace("bk-", "");
    btn.textContent = USER_BOOKMARKS[id] === true ? "[ / ] Enregistré" : "[ + ] Enregistrer";
  });
}

function resetBookmarkUI() {
  document.querySelectorAll(".bookmark-btn").forEach(btn => {
    btn.textContent = "[ + ] Enregistrer";
  });
}

window.toggleBookmark = async function(id) {
  const user = firebase.auth().currentUser;
  if (!user || user.isAnonymous) {
    alert("Veuillez vous connecter avec Google pour enregistrer des favoris.");
    return;
  }
  const ref = fbDb.ref(`users/${user.uid}/bookmarks/${id}`);
  const btn = document.getElementById(`bk-${id}`);

  try {
    const snap = await ref.once("value");
    if (snap.exists()) {
      await ref.remove();
      if (btn) btn.textContent = "[ + ] Enregistrer";
    } else {
      await ref.set(true);
      if (btn) btn.textContent = "[ / ] Enregistré";
    }
  } catch (e) {
    console.error("Erreur bookmark :", e);
    alert("Impossible de modifier le favori.");
  }
};

/* ---------- Système de Commentaires ---------- */

async function loadComments(articleId) {
  const container = document.getElementById("commentsList");
  const formContainer = document.getElementById("commentFormContainer");
  if (!container || !formContainer) return;

  const user = firebase.auth().currentUser;
  const isLogged = user && !user.isAnonymous;

  if (isLogged) {
    formContainer.innerHTML = `
      <form id="commentForm" style="display: flex; flex-direction: column; gap: 10px;">
        <textarea id="commentInput" placeholder="Écrire un commentaire..." required style="padding: 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,0.4); background: transparent; color: inherit; font-family: inherit; resize: vertical; min-height: 80px;"></textarea>
        <button type="submit" class="tool-btn" style="align-self: flex-start;">Publier le commentaire</button>
      </form>
    `;
    const form = document.getElementById("commentForm");
    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = document.getElementById("commentInput").value.trim();
      if (!text) return;

      try {
        const pseudoSnap = await fbDb.ref(`users/${user.uid}/profile/pseudo`).once("value");
        const pseudo = pseudoSnap.val() || "Membre";

        const newCommentRef = fbDb.ref(`comments/${likeKey(articleId)}`).push();
        await newCommentRef.set({
          author: pseudo,
          text: text,
          date: Date.now()
        });
        document.getElementById("commentInput").value = "";
        loadComments(articleId);
      } catch (err) {
        console.error("Erreur d'envoi du commentaire :", err);
        alert("Impossible d'envoyer le commentaire.");
      }
    };
  } else {
    formContainer.innerHTML = `<p style="font-size: 0.9rem; opacity: 0.7;">Connectez-vous avec Google pour poster un commentaire.</p>`;
  }

  try {
    const snap = await fbDb.ref(`comments/${likeKey(articleId)}`).once("value");
    const comments = snap.val();
    if (!comments) {
      container.innerHTML = `<p style="opacity: 0.6; font-size: 0.9rem;">Aucun commentaire pour l'instant.</p>`;
      return;
    }

    let html = "";
    Object.values(comments).sort((a, b) => b.date - a.date).forEach(c => {
      const dateStr = new Date(c.date).toLocaleDateString("fr-FR", { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      html += `
        <div style="background: rgba(127,127,127,0.08); padding: 12px; border-radius: 8px; margin-bottom: 10px;">
          <div style="display: flex; justify-content: space-between; font-size: 0.8rem; opacity: 0.7; margin-bottom: 4px;">
            <strong>${escapeHtml(c.author)}</strong>
            <span>${dateStr}</span>
          </div>
          <p style="margin: 0; font-size: 0.95rem; word-break: break-word;">${escapeHtml(c.text)}</p>
        </div>
      `;
    });
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<p style="color: #ff6b6b; font-size: 0.9rem;">Erreur de chargement des commentaires.</p>`;
  }
}

/* ---------- Likes ---------- */

async function fetchLikeCount(id) {
  try {
    const snap = await fbDb.ref(`likes/${likeKey(id)}/count`).once("value");
    return snap.val() || 0;
  } catch { return 0; }
}

async function hasLiked(id) {
  try {
    const user = await ensureAuth();
    const snap = await fbDb.ref(`likes/${likeKey(id)}/voters/${user.uid}`).once("value");
    return snap.exists();
  } catch { return false; }
}

async function incrementLikeCount(id) {
  const user = await ensureAuth();
  const key = likeKey(id);
  const countRef = fbDb.ref(`likes/${key}/count`);

  for (let attempt = 0; attempt < 4; attempt++) {
    const current = (await countRef.once("value")).val() || 0;
    const next = current + 1;
    try {
      await fbDb.ref().update({
        [`likes/${key}/count`]: next,
        [`likes/${key}/voters/${user.uid}`]: true
      });
      return next;
    } catch (e) {
      if (attempt === 3) throw e;
    }
  }
}

function updateLikeDisplays(id, count) {
  document.querySelectorAll(`[data-like-display="${CSS.escape(id)}"]`).forEach(el => {
    el.textContent = String(count);
  });
}

function setLikedState(btn, liked) {
  const label = btn.querySelector(".like-label");
  if (label) label.textContent = liked ? "♥ Aimé" : "♡ J'aime";
  btn.disabled = liked;
}

async function wireLikeButton(id) {
  const btn = document.querySelector(`[data-like-btn="${CSS.escape(id)}"]`);
  if (!btn) return;

  btn.disabled = true;
  setLikedState(btn, await hasLiked(id));

  btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      const count = await incrementLikeCount(id);
      setLikedState(btn, true);
      updateLikeDisplays(id, count);
    } catch (e) {
      console.error("Erreur like Firebase :", e);
      btn.disabled = false;
      alert("Impossible d'enregistrer ton like pour le moment, réessaie plus tard.");
    }
  });
}

window.addEventListener("hashchange", render);
loadArticles();
</script>
